name: Test

# Builds hyprweave against the newest Hyprland in Arch Linux and runs tests/nest-test.sh in a VM.
# The daily run catches a new Hyprland release that breaks the plugin, and proposes a hyprpm.toml
# pin for a new release that passes.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # the runner is self-hosted: pull requests from forks never run on it
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-hyprweave
    timeout-minutes: 60
    container:
      image: archlinux:latest
      options: --device /dev/kvm
    env:
      # the cluster's Arch package cache (kub-homelab docs/arc-runners.md)
      PACMAN_MIRROR: http://pacoloco.arc-runners.svc.cluster.local:9129/repo/archlinux/$repo/os/$arch
    outputs:
      hyprland-version: ${{ steps.hyprland.outputs.version }}
      hyprland-commit: ${{ steps.hyprland.outputs.commit }}
    steps:
      - uses: actions/checkout@v6

      - name: Build and test in a VM
        run: tests/ci/run.sh

      - name: Hyprland version
        id: hyprland
        if: always()
        shell: bash
        run: |
          cat ci-logs/versions.txt >>"$GITHUB_STEP_SUMMARY" || true
          # "Hyprland 0.57.0 built from branch v0.57.0 at commit <40 hex> ..."
          LINE=$(grep -m1 '^Hyprland ' ci-logs/versions.txt || true)
          if [[ $LINE =~ ^Hyprland\ ([0-9.]+)\ .*\ commit\ ([0-9a-f]{40}) ]]; then
              echo "version=${BASH_REMATCH[1]}" >>"$GITHUB_OUTPUT"
              echo "commit=${BASH_REMATCH[2]}" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs
          path: ci-logs

  pin:
    needs: test
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.test.outputs.hyprland-commit != ''
    runs-on: ubuntu-latest
    # one at a time, so two runs never race for the same pull request
    concurrency:
      group: pin
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Propose a hyprpm.toml pin
        env:
          GH_TOKEN: ${{ github.token }}
          HYPRLAND_VERSION: ${{ needs.test.outputs.hyprland-version }}
          HYPRLAND_COMMIT: ${{ needs.test.outputs.hyprland-commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: tests/ci/propose-pin.sh

  keepalive:
    # GitHub turns off scheduled workflows in a public repository after 60 days without a commit;
    # enabling the workflow again on every scheduled run keeps it on
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/enable"
